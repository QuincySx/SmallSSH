# Manual publishing preparation: builds every desktop target in one run, the same
# way `go run ./tools build` does on a workstation. Runs only when the owner starts
# it from the Actions page; there is no push, tag or release trigger.
#
# It still never publishes by itself - no tag, no GitHub Release, no upload
# anywhere. The result is a workflow artifact (a tarball, so permissions and
# symlinks survive) kept for 7 days, for a human to inspect and ship.
#
# Why this is not part of Checks: packaging needs the macOS Xcode toolchain and a
# signing identity, and ad-hoc signatures differ between Xcode versions, so
# `tools build -check` (which compares committed component hashes) can only be a
# local step. Releasing stays a manual local step.
name: Publisher

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Comma-separated targets, or "all" for every desktop
        default: all
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go run ./tools build
        run: go run ./tools build -platform "${{ inputs.platform }}"
      - name: One tarball per platform
        run: |
          mkdir -p dist
          # Only the targets tools build produces: arch names, never a stray
          # directory a previous step left in build/.
          for dir in build/*-amd64/ build/*-arm64/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            tar -czf "dist/smallssh-$name.tar.gz" -C "$dir" .
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: smallssh-dist
          path: dist/*.tar.gz
          retention-days: 7
