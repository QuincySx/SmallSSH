<sp-component name="输入框" props="状态: 普通 | 焦点 | 错误">
  <div class="flex flex-row items-center px-space-md w-[260px] h-field bg-surface border border-border rounded-control">
    <p data-name="值" class="w-full text-text type-body leading-[20]">请输入</p>
  </div>
  <sp-variant when="状态: 焦点" class="border border-accent"></sp-variant>
  <sp-variant when="状态: 错误" class="border border-danger"></sp-variant>
</sp-component>
