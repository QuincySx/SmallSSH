<sp-component name="导航项" props="状态: 普通 | 选中; 图标: 显示 | 隐藏">
  <div class="flex flex-row items-center gap-space-sm px-space-sm w-[184px] h-field bg-[#00000000] rounded-control">
    <div data-name="图标" class="flex flex-row items-center justify-center w-[24px] h-[24px] bg-accentsoft rounded-nav-icon">
      <p data-name="字标" class="w-full text-accent type-caption text-center">S</p>
    </div>
    <p data-name="标签" class="w-full text-text type-control">导航</p>
  </div>
  <sp-variant when="状态: 选中" class="bg-accentsoft">
    <p data-name="标签" class="text-accent"></p>
  </sp-variant>
  <sp-variant when="图标: 隐藏"><div data-name="图标" class="hidden"></div></sp-variant>
</sp-component>
