    <p data-name="占位文字" class="w-full text-muted type-body">输入主密码</p>
    <p data-name="系统验证入口" class="w-[22px] h-[22px] text-accent hidden font-[SmallSSH_Icons] text-[22px] leading-[1]"></p>
  </div>
  <sp-variant when="状态: 焦点" class="border border-accent"></sp-variant>

  </sp-variant>
</sp-component>
