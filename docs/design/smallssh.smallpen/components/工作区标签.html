<sp-component name="工作区标签" props="状态: 普通 | 选中 | 非焦点">
  <div class="flex flex-row items-center gap-space-sm py-tab-block px-space-sm h-control bg-[#00000000] rounded-control">
    <p data-name="名称" class="text-text type-panel-label">Web 生产环境</p>
    <p data-name="关闭" class="w-[14px] text-muted font-icons text-icon-compact"></p>
  </div>
  <sp-variant when="状态: 选中" class="bg-workspace-selected">
    <p data-name="名称" class="text-accent"></p>
  </sp-variant>
  <sp-variant when="状态: 非焦点" class="bg-subtle">
    <p data-name="名称" class="text-muted"></p>
  </sp-variant>
</sp-component>
