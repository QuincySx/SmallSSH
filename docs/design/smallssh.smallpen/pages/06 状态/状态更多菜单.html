<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>状态更多菜单</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[208px] h-[134px] bg-surface">
  <div data-name="状态设置菜单" class="flex flex-col py-space-xs w-full h-full bg-surface rounded-control border border-border">
    <div data-name="设置分组" class="flex flex-row items-center px-space-md w-full h-[24px]">
      <p data-name="标题" class="w-full text-muted type-detail">趋势时间范围</p>
    </div>
    <div data-name="1 分钟" data-click="close-overlay" class="flex flex-row items-center px-space-md w-full h-menu-item">
      <p data-name="文字" class="w-full text-text type-menu">1 分钟</p>
    </div>
    <div data-name="5 分钟" data-click="close-overlay" class="flex flex-row items-center px-space-md w-full h-menu-item">
      <p data-name="文字" class="w-full text-text type-menu">5 分钟</p>
      <p data-name="选中" class="text-accent type-menu">✓</p>
    </div>
    <div data-name="15 分钟" data-click="close-overlay" class="flex flex-row items-center px-space-md w-full h-menu-item">
      <p data-name="文字" class="w-full text-text type-menu">15 分钟</p>
    </div>
  </div>
</body>
</html>
