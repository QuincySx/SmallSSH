<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>连接中</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[1280px] h-[860px] bg-canvas">
  <div data-name="工作台根" class="flex flex-col w-full h-full">
    <div data-name="标题栏" class="flex flex-row items-center gap-[8px] pr-[8px] w-full h-titlebar">
      <sp-use component="窗口控制" data-name="原生窗口按钮"></sp-use>
      <sp-use component="图标按钮" data-name="侧栏开关">
        <p data-name="图标"></p>
      </sp-use>
      <div data-name="对齐留白" class="flex flex-col gap-[8px] w-[88px] h-[1px]"></div>
      <sp-use component="工作区标签" props="状态: 选中" data-name="Web 生产环境标签">
        <p data-name="名称">Web 生产环境</p>
      </sp-use>
      <sp-use component="工作区标签" data-name="Staging标签">
        <p data-name="名称">Staging</p>
      </sp-use>
      <div data-name="拖动空白" class="flex flex-col gap-[8px] w-full h-full"></div>
      <sp-use component="图标按钮" data-name="工作区分栏">
        <p data-name="图标"></p>
      </sp-use>
      <sp-use component="图标按钮" data-name="新建终端">
        <p data-name="图标"></p>
      </sp-use>
      <sp-use component="图标按钮" data-name="任务入口">
        <p data-name="图标"></p>
      </sp-use>
      <sp-use component="图标按钮" data-name="工具面板开关">
        <p data-name="图标"></p>
      </sp-use>
      <sp-use component="图标按钮" data-name="设置入口">
        <p data-name="图标"></p>
      </sp-use>
    </div>
    <div data-name="工作区" class="flex flex-row items-center gap-[8px] pr-[8px] pb-[8px] pl-[8px] w-full h-full">
      <div data-name="服务器侧栏" class="flex flex-col gap-[8px] w-sidebar h-full">
        <sp-use component="按钮" props="样式: 轻量" data-name="新建连接">
          <p data-name="文字">＋  新建连接</p>
        </sp-use>
        <sp-use component="输入框" data-name="搜索服务器" class="w-full">
          <p data-name="值">搜索服务器</p>
        </sp-use>
        <p data-name="分组" class="w-full text-muted type-detail">我的服务器</p>
        <sp-use component="导航项" props="状态: 选中" data-name="Web 生产环境" class="w-full">
          <p data-name="标签">Web 生产环境</p>
          <div data-name="图标">
            <p data-name="字标">W</p>
          </div>
        </sp-use>
        <sp-use component="导航项" data-name="Staging" class="w-full">
          <p data-name="标签">Staging</p>
          <div data-name="图标">
            <p data-name="字标">S</p>
          </div>
        </sp-use>
        <sp-use component="导航项" data-name="备份服务器" class="w-full">
          <p data-name="标签">备份服务器</p>
          <div data-name="图标">
            <p data-name="字标">备</p>
          </div>
        </sp-use>
      </div>
      <div data-name="主内容" class="flex flex-col gap-[8px] w-full h-full">
        <div data-name="终端内容" class="flex flex-col gap-[8px] p-[16px] w-full h-full bg-surface rounded-panel">
          <p data-name="状态" class="w-full text-text type-title">正在连接 Web 生产环境…</p>
          <p data-name="说明" class="w-full text-muted type-body">窗口立即显示；正在完成 SSH 握手。</p>
          <sp-use component="按钮" props="样式: 普通" data-name="取消连接">
            <p data-name="文字">取消连接</p>
          </sp-use>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
