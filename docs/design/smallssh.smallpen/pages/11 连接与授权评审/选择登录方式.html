<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>选择登录方式</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="连接与授权 · 优化评审" class="flex flex-col w-[220px] h-fit p-space-xs rounded-control bg-surface border border-border">
  <div data-name="服务器密码" class="flex flex-row items-center gap-space-sm w-full h-control px-space-md rounded-control" data-click="11 连接与授权评审/新建连接">
    <p data-name="名称" class="type-native-copy text-text">服务器密码</p>
  </div>
  <div data-name="已有私钥" class="flex flex-row items-center gap-space-sm w-full h-control px-space-md rounded-control" data-click="11 连接与授权评审/已有私钥">
    <p data-name="名称" class="type-native-copy text-text">已有私钥</p>
  </div>
  <div data-name="SmallSSH 密钥" class="flex flex-row items-center gap-space-sm w-full h-control px-space-md rounded-control" data-click="11 连接与授权评审/SmallSSH 密钥">
    <p data-name="名称" class="type-native-copy text-text">SmallSSH 密钥</p>
  </div>
  <div data-name="SSH 密钥代理" class="flex flex-row items-center gap-space-sm w-full h-control px-space-md rounded-control" data-click="11 连接与授权评审/SSH 密钥代理">
    <p data-name="名称" class="type-native-copy text-text">SSH 密钥代理</p>
  </div>
  <div data-name="硬件密钥" class="flex flex-row items-center gap-space-sm w-full h-control px-space-md rounded-control" data-click="11 连接与授权评审/硬件密钥">
    <p data-name="名称" class="type-native-copy text-text">硬件密钥</p>
  </div>
</body>
</html>
