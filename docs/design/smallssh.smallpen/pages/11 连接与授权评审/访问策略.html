<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>访问策略</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="连接与授权 · 优化评审" class="relative flex items-center justify-center w-[1100px] h-[760px] bg-canvas">
  <div data-name="工作台承载" class="absolute inset-0 flex flex-row">
    <sp-use data-name="工作台背景" class="w-full h-full" component="连接弹窗背景">
      <div data-name="服务器侧栏">
        <div data-name="服务器">
          <p data-name="名称" class="">Web 生产环境</p>
        </div>
      </div>
    </sp-use>
  </div>
  <div data-name="模态遮罩" class="absolute inset-0 bg-dialog-shade"></div>
  <div data-name="连接对话框" class="flex flex-col gap-space-md w-dialog-large h-connection-editor-height p-space-lg bg-surface rounded-window-panel shadow-native-dialog">
    <div data-name="标题栏" class="flex flex-row items-center gap-space-sm w-full h-control shrink-0">
      <p data-name="窗口标题" class="flex-1 type-native-dialog text-text">新建连接</p>
      <sp-use data-name="关闭" class="shrink-0" component="图标按钮">
        <p data-name="图标" class=""></p>
      </sp-use>
    </div>
    <div data-name="分类与内容" class="flex flex-row flex-1 min-h-0 w-full gap-space-xl">
      <div data-name="连接分类" class="flex flex-col gap-space-xs w-dialog-sidebar shrink-0 h-full bg-subtle border border-border p-dialog-sidebar rounded-control">
        <sp-use data-name="常规" class="w-full h-dialog-category" component="导航项" props="图标: 隐藏; 状态: 普通" data-click="11 连接与授权评审/新建连接">
          <p data-name="标签" class="">常规</p>
        </sp-use>
        <sp-use data-name="加速与代理" class="w-full h-dialog-category" component="导航项" props="图标: 隐藏; 状态: 普通" data-click="11 连接与授权评审/连接线路">
          <p data-name="标签" class="">加速与代理</p>
        </sp-use>
        <sp-use data-name="终端设置" class="w-full h-dialog-category" component="导航项" props="图标: 隐藏; 状态: 普通" data-click="11 连接与授权评审/终端设置">
          <p data-name="标签" class="">终端设置</p>
        </sp-use>
        <sp-use data-name="访问策略" class="w-full h-dialog-category" component="导航项" props="图标: 隐藏; 状态: 选中" data-click="11 连接与授权评审/访问策略">
          <p data-name="标签" class="">访问策略</p>
        </sp-use>
      </div>
      <div data-name="分类表单" class="flex flex-col gap-space-lg flex-1 min-w-0 h-full overflow-hidden pr-connection-form-end">
        <div data-name="AI 访问" class="flex flex-col gap-space-sm w-full">
          <p data-name="标题" class="type-section text-text">AI 访问</p>
          <sp-use data-name="允许 AI 访问此服务器" class="w-full" component="复选框" props="状态: 选中; 可用: 启用">
            <p data-name="标签" class="">允许 AI 访问此服务器</p>
          </sp-use>
          <sp-use data-name="保护关键操作" class="w-full" component="复选框" props="状态: 选中; 可用: 启用">
            <p data-name="标签" class="">保护关键操作</p>
          </sp-use>
        </div>
        <div data-name="规则分隔" class="w-full h-review-divider bg-border"></div>
        <div data-name="保护路径" class="flex flex-col gap-space-sm w-full">
          <p data-name="标题" class="type-section text-text">保护路径</p>
          <p data-name="说明" class="type-native-small text-muted">AI 文件操作无法读取、下载或修改已保护的路径。</p>
          <div data-name="路径输入" class="flex flex-col gap-space-sm w-full h-protected-paths p-space-md bg-surface border border-border rounded-control">
            <p data-name="当前路径" class="w-full type-path text-text">/etc<br>/boot<br>/usr<br>/bin<br>/sbin<br>/lib<br>/lib64<br>/proc<br>/sys<br>/dev<br>/home<br>/root</p>
          </div>
          <p data-name="编辑提示" class="type-native-hint text-muted">每行一个绝对路径；留空恢复默认。</p>
        </div>
      </div>
    </div>
    <div data-name="底部" class="flex flex-col gap-space-sm w-full">
      <div data-name="操作分隔" class="w-full h-review-divider bg-border"></div>
      <div data-name="底部操作" class="flex flex-row items-center gap-space-sm w-full h-field">
        <p data-name="保存说明" class="flex-1 type-native-hint text-muted">保存连接后，从服务器列表打开连接。</p>
        <sp-use data-name="取消" component="按钮" props="样式: 普通">
          <p data-name="文字" class="">取消</p>
        </sp-use>
        <sp-use data-name="保存连接" component="按钮" props="样式: 主操作">
          <p data-name="文字" class="">保存连接</p>
        </sp-use>
      </div>
    </div>
  </div>
</body>
</html>
