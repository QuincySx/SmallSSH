<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>选择保活等待上限</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="连接与授权 · 优化评审" class="flex flex-col w-[220px] h-fit p-space-xs rounded-control bg-surface border border-border">
  <div data-name="30 秒（1 个间隔）" class="flex flex-col justify-center w-full h-control px-space-md rounded-control" data-click="11 连接与授权评审/终端设置 · 等待 30 秒">

  <div data-name="90 秒（3 个间隔，默认）" class="flex flex-col justify-center w-full h-control px-space-md rounded-control" data-click="11 连接与授权评审/终端设置 · 保活 30 秒">
    <p data-name="名称" class="type-native-copy text-text">90 秒（3 个间隔，默认）</p>
  </div>
  <div data-name="150 秒（5 个间隔）" class="flex flex-col justify-center w-full h-control px-space-md rounded-control" data-click="11 连接与授权评审/终端设置 · 等待 150 秒">
    <p data-name="名称" class="type-native-copy text-text">150 秒（5 个间隔）</p>
  </div>

</html>
