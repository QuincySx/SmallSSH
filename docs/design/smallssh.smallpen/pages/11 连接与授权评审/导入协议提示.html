<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>导入协议提示</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="连接与授权 · 优化评审" class="flex flex-col gap-space-sm w-[296px] h-fit p-space-md rounded-control border border-border bg-surface">
  <p data-name="标题" class="type-native-label text-text">支持导入的协议</p>
  <div data-name="分享链接" class="flex flex-col gap-native-field w-full">
    <p data-name="格式" class="type-native-small text-muted">分享链接</p>
    <p data-name="协议" class="w-full type-native-copy text-text">Shadowsocks、VLESS（TLS / REALITY）</p>
    <p data-name="其他协议" class="w-full type-native-copy text-text">AnyTLS、Hysteria 2</p>
  </div>
  <div data-name="节点 JSON" class="flex flex-col gap-native-field w-full">
    <p data-name="格式" class="type-native-small text-muted">节点 JSON</p>
    <p data-name="协议" class="w-full type-native-copy text-text">支持上述协议，也支持 Snell。</p>
  </div>
</body>
</html>
