<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>线路 · 选择导入节点</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="连接与授权 · 优化评审" class="relative flex items-center justify-center w-[1100px] h-[760px] bg-canvas">
  <div data-name="工作台承载" class="absolute inset-0 flex flex-row">
      <sp-use data-name="工作台背景" class="w-full h-full" component="连接弹窗背景">
        <div data-name="服务器侧栏">
          <div data-name="服务器">
            <p data-name="名称" class="">Web 生产环境</p>
          </div>
        </div>
      </sp-use>
    </div>
    <div data-name="模态遮罩" class="absolute inset-0 bg-dialog-shade"></div>
  <div data-name="线路窗口" class="flex flex-col gap-space-md w-[560px] h-fit p-space-lg bg-surface rounded-window-panel shadow-native-dialog">
    <div data-name="标题栏" class="flex flex-row items-center gap-space-sm w-full">
      <p data-name="标题" class="type-native-dialog text-text flex-1">选择导入节点</p>
      <sp-use data-name="关闭" class="shrink-0" component="图标按钮" data-click="back">
        <p data-name="图标" class=""></p>
      </sp-use>
    </div>
    <div data-name="解析结果" class="flex flex-col gap-space-sm w-full">
      <p data-name="解析反馈" class="type-native-hint text-muted">已提取 2 个可用节点。原始输入已清除。</p>
      <div data-name="选择导入节点" class="flex flex-col gap-native-field w-full">
        <p data-name="标签" class="type-native-small text-muted">选择导入节点</p>
        <div data-name="输入" class="flex flex-row items-center gap-space-sm w-full h-field px-field-inline rounded-control border border-border bg-surface">
          <p data-name="内容" class="type-native-copy text-text flex-1 min-w-0">备用代理 · AnyTLS · proxy.example:443</p>
          <p data-name="下拉" class="type-native-action-icon text-muted w-menu-icon shrink-0 text-center"></p>
        </div>
      </div>
      <div data-name="确认操作" class="flex flex-row items-center gap-space-sm w-full">
        <sp-use data-name="使用所选节点" class="shrink-0" component="按钮" props="样式: 普通" data-click="11 连接与授权评审/线路 · 导入节点">
          <p data-name="文字" class="">使用所选节点</p>
        </sp-use>
        <sp-use data-name="重新粘贴" class="shrink-0" component="按钮" props="样式: 普通" data-click="11 连接与授权评审/新建线路 · 导入">
          <p data-name="文字" class="">重新粘贴</p>
        </sp-use>
      </div>
    </div>
    <div data-name="底部分隔" class="w-full h-review-divider bg-border shrink-0"></div>
    <div data-name="底部操作" class="flex flex-row items-center gap-space-sm w-full justify-end">
      <sp-use data-name="取消" class="shrink-0" component="按钮" props="样式: 普通" data-click="back">
        <p data-name="文字" class="">取消</p>
      </sp-use>
      <sp-use data-name="保存线路" class="shrink-0 opacity-disabled" component="按钮" props="样式: 主操作">
        <p data-name="文字" class="">保存线路</p>
      </sp-use>
    </div>
  </div>
</body>
</html>
