<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>独立授权 · 中风险免确认</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="连接与授权 · 优化评审" class="flex flex-col gap-space-xs w-authorization-prompt h-approval-prompt-height px-approval-prompt-inline py-space-md bg-canvas">
  <div data-name="请求标题" class="flex flex-col w-full gap-native-field">
    <p data-name="标题" class="type-native-dialog text-text">服务器操作授权</p>
    <p data-name="申请方" class="type-native-hint text-muted">申请方  Offline QA</p>
  </div>
  <div data-name="授权范围" class="flex flex-col w-full gap-space-sm px-space-md py-space-sm bg-surface border border-border rounded-window-panel">
    <p data-name="目标服务器" class="type-native-label text-text">Web 生产环境</p>
    <p data-name="连接地址" class="type-path text-muted">deploy@192.0.2.10:22</p>
    <div data-name="权限分隔" class="w-full h-review-divider bg-border shrink-0"></div>
    <p data-name="权限" class="type-native-label text-text">限时受控</p>
  </div>
  <div data-name="期限设置" class="flex flex-col w-full gap-space-sm">
    <div data-name="有效期" class="flex flex-row items-center gap-space-sm w-full">
      <p data-name="标签" class="type-native-hint text-muted flex-1">有效期</p>
      <div data-name="选择" class="flex flex-col gap-native-field w-approval-idle">
        <div data-name="输入" class="flex flex-row items-center gap-space-xs w-full px-field-inline rounded-control border border-border h-approval-duration bg-surface">
          <p data-name="内容" class="type-native-hint text-text flex-1 min-w-0">2 小时</p>
          <p data-name="下拉" class="type-native-action-icon text-muted w-menu-icon shrink-0 text-center"></p>
        </div>
      </div>
    </div>
    <div data-name="闲置断开" class="flex flex-row items-center gap-space-sm w-full">
      <p data-name="标签" class="type-native-hint text-muted flex-1">闲置断开</p>
      <div data-name="选择" class="flex flex-col gap-native-field w-approval-idle">
        <div data-name="输入" class="flex flex-row items-center gap-space-xs w-full px-field-inline rounded-control border border-border h-approval-duration bg-surface">
          <p data-name="内容" class="type-native-hint text-text flex-1 min-w-0">15 分钟</p>
          <p data-name="下拉" class="type-native-action-icon text-muted w-menu-icon shrink-0 text-center"></p>
        </div>
      </div>
    </div>
    <div data-name="中风险文件确认" class="flex flex-col gap-native-field w-full">
      <div data-name="中风险确认" class="flex flex-row items-center gap-space-sm w-full">
        <p data-name="规则" class="type-native-hint text-muted flex-1">确认中风险文件操作</p>
        <div data-name="中风险确认开关" data-click="11 连接与授权评审/独立授权 · 服务器操作" class="flex flex-row items-center w-switch-track h-switch-height shrink-0 justify-start p-switch-inset bg-switch-off rounded-switch"><div data-name="拨钮" class="w-switch-knob h-switch-knob rounded-switch bg-switch-knob"></div></div>
      </div>
      <sp-use data-name="关闭后的提示" component="中风险免确认提示" class="w-full"></sp-use>
    </div>
  </div>
  <sp-use data-name="配对码核对" component="配对码核对" props="密度: 紧凑" class="w-full"></sp-use>
  <div data-name="弹性空间" class="flex-1 min-h-0"></div>
  <sp-use data-name="验证与决定" component="授权验证底栏" props="状态: 待验证; 切换验证: 有" class="w-full">
    <div data-name="操作">
      <div data-name="拒绝" data-click="11 连接与授权评审/暂无授权请求"></div>
    </div>
  </sp-use>
</body>
</html>
