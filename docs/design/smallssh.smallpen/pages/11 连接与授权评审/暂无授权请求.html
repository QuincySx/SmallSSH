<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>暂无授权请求</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body data-canvas="连接与授权 · 优化评审" class="flex flex-row p-space-sm gap-space-sm w-[1080px] h-[800px] bg-canvas">
  <div data-name="设置导航" class="flex flex-col gap-space-sm w-settings-nav shrink-0 h-full px-space-md py-space-sm bg-surface rounded-window-panel">
    <div data-name="设置窗口" class="flex flex-row items-center gap-space-sm w-full h-control">
      <p data-name="标题" class="type-section text-text">设置</p>
    </div>
    <div data-name="设置分类" class="flex flex-col gap-space-xs w-full">
      <sp-use data-name="工作区" class="w-full h-control" component="导航项" props="图标: 隐藏; 状态: 普通">
        <p data-name="标签" class="">工作区</p>
      </sp-use>
      <sp-use data-name="安全与解锁" class="w-full h-control" component="导航项" props="图标: 隐藏; 状态: 普通">
        <p data-name="标签" class="">安全与解锁</p>
      </sp-use>
      <sp-use data-name="SSH 密钥" class="w-full h-control" component="导航项" props="图标: 隐藏; 状态: 普通">
        <p data-name="标签" class="">SSH 密钥</p>
      </sp-use>
      <sp-use data-name="加速与代理" class="w-full h-control" component="导航项" props="图标: 隐藏; 状态: 普通" data-click="11 连接与授权评审/加速与代理 · 线路库">
        <p data-name="标签" class="">加速与代理</p>
      </sp-use>
      <sp-use data-name="运行与后台" class="w-full h-control" component="导航项" props="图标: 隐藏; 状态: 普通">
        <p data-name="标签" class="">运行与后台</p>
      </sp-use>
      <sp-use data-name="授权中心" class="w-full h-control" component="导航项" props="图标: 隐藏; 状态: 选中">
        <p data-name="标签" class="">授权中心</p>
      </sp-use>
    </div>
  </div>
  <div data-name="设置内容" class="flex flex-col gap-space-lg flex-1 min-w-0 h-full p-space-xl bg-surface rounded-window-panel">
    <div data-name="标题栏" class="flex flex-row items-center gap-space-sm w-full h-control">
      <p data-name="标题" class="flex-1 type-vaulttitle text-text">授权中心</p>
      <sp-use data-name="关闭设置" class="shrink-0" component="图标按钮">
        <p data-name="图标" class=""></p>
      </sp-use>
    </div>
    <div data-name="视图切换" class="flex flex-col gap-space-md w-full">
      <div data-name="授权分类" class="flex flex-row items-center gap-native-field w-full">
        <div data-name="待确认" class="flex flex-row items-center gap-space-sm w-fit h-task-tab px-field-inline rounded-control bg-native-tab-selected" data-click="11 连接与授权评审/待确认授权">
          <p data-name="标签" class="type-native-copy text-accent">待确认</p>
        </div>
        <div data-name="当前授权" class="flex flex-row items-center gap-space-sm w-fit h-task-tab px-field-inline rounded-control" data-click="11 连接与授权评审/当前授权">
          <p data-name="标签" class="type-native-copy text-muted">当前授权</p>
        </div>
        <div data-name="审计记录" class="flex flex-row items-center gap-space-sm w-fit h-task-tab px-field-inline rounded-control" data-click="11 连接与授权评审/审计记录">
          <p data-name="标签" class="type-native-copy text-muted">审计记录</p>
        </div>
      </div>
      <div data-name="导航分隔" class="w-full h-review-divider bg-border"></div>
    </div>
    <div data-name="暂无请求" class="flex flex-col flex-1 min-h-0 items-center justify-center w-full">
      <p data-name="空态" class="type-native-dialog text-muted">暂无授权请求</p>
    </div>
  </div>
</body>
</html>
