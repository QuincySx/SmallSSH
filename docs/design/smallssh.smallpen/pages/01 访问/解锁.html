<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>解锁</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[1280px] h-[860px] bg-vaultbackdrop">
  <div data-name="原生标题栏" class="flex flex-row w-full h-[48px] bg-canvas">
    <sp-use component="窗口控制" data-name="原生窗口按钮" class="h-[48px]"></sp-use>
  </div>
  <div data-name="居中解锁区" class="flex flex-col items-center justify-center p-[28px] w-full h-full bg-vaultbackdrop">
    <div data-name="保险库卡片" class="flex flex-col gap-[20px] p-[26px] w-[392px] bg-vaultsurface border border-border rounded-[16px]">
      <div data-name="身份标题" class="flex flex-col items-center gap-[10px] w-full">
        <div data-name="锁标志" class="flex flex-col items-center justify-center w-[40px] h-[40px] bg-accentsoft rounded-[12px]">
          <p data-name="锁图标" class="text-accent font-[SmallSSH_Icons] text-[22px] leading-[1]"></p>
        </div>
        <p data-name="标题" class="text-text type-vaulttitle">解锁保险库</p>
      </div>
      <div data-name="认证字段" class="flex flex-col gap-[12px] w-full">
        <sp-use component="解锁密码框" props="状态: 焦点" data-name="主密码" class="w-full">
          <p data-name="占位文字">输入主密码</p>
        </sp-use>
      </div>
      <sp-use component="按钮" data-name="确认解锁" class="w-full h-[38px] opacity-[0.45]">
        <p data-name="文字">解锁</p>
      </sp-use>
    </div>
  </div>
</body>
</html>
