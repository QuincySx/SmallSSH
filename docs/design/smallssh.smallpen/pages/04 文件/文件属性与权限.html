<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>文件属性与权限</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[900px] h-[700px] bg-canvas">
  <div data-name="模态承载" class="flex flex-col gap-[8px] p-[40px] w-full h-full bg-canvas">
    <div data-name="对话框" class="flex flex-col gap-[16px] p-[16px] w-full h-full bg-surface rounded-panel">
      <div data-name="标题" class="flex flex-row items-center gap-[8px] w-full">
        <p data-name="标题文字" class="w-full text-text type-section">属性与权限</p>
        <sp-use component="图标按钮" data-name="关闭弹窗">
          <p data-name="图标"></p>
        </sp-use>
      </div>
      <div data-name="属性" class="flex flex-col gap-[8px] w-full">
        <div data-name="字段组" class="flex flex-col gap-[12px] w-full">
          <div data-name="字段 名称" class="flex flex-row items-center gap-[8px] w-full">
            <p data-name="标签" class="w-[116px] text-text type-body">名称</p>
            <sp-use component="输入框" data-name="值" class="w-full">
              <p data-name="值">nginx.conf</p>
            </sp-use>
          </div>
          <div data-name="字段 类型" class="flex flex-row items-center gap-[8px] w-full">
            <p data-name="标签" class="w-[116px] text-text type-body">类型</p>
            <sp-use component="输入框" data-name="值" class="w-full">
              <p data-name="值">普通文件</p>
            </sp-use>
          </div>
          <div data-name="字段 所有者" class="flex flex-row items-center gap-[8px] w-full">
            <p data-name="标签" class="w-[116px] text-text type-body">所有者</p>
            <sp-use component="输入框" data-name="值" class="w-full">
              <p data-name="值">root</p>
            </sp-use>
          </div>
          <div data-name="字段 组" class="flex flex-row items-center gap-[8px] w-full">
            <p data-name="标签" class="w-[116px] text-text type-body">组</p>
            <sp-use component="输入框" data-name="值" class="w-full">
              <p data-name="值">root</p>
            </sp-use>
          </div>
          <div data-name="字段 权限" class="flex flex-row items-center gap-[8px] w-full">
            <p data-name="标签" class="w-[116px] text-text type-body">权限</p>
            <sp-use component="输入框" data-name="值" class="w-full">
              <p data-name="值">rw-r--r--  (0644)</p>
            </sp-use>
          </div>
        </div>
        <p data-name="内容" class="w-full text-muted type-body">大小 876 B · 修改于 2026-11-07 09:30</p>
      </div>
      <div data-name="底部操作" class="flex flex-row items-center gap-[8px] w-full">
        <sp-use component="按钮" props="样式: 普通" data-name="取消">
          <p data-name="文字">取消</p>
        </sp-use>
        <sp-use component="按钮" data-name="保存权限">
          <p data-name="文字">保存权限</p>
        </sp-use>
      </div>
    </div>
  </div>
</body>
</html>
