<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>运行与后台</title>
    <link rel="stylesheet" href="../../tokens.css">
  </head>
  <body class="flex flex-col w-[1080px] h-[760px] bg-canvas">
    <div data-name="设置窗口" class="w-[1080px] h-[760px] bg-canvas">
      <div data-name="设置导航" class="flex flex-col gap-space-xs pr-space-md pb-space-md pl-space-md left-[8px] top-[8px] w-[200px] h-[744px] bg-surface rounded-window-panel">
        <div data-name="设置标题" class="flex flex-row items-center gap-space-sm pl-window-title-inset w-full h-[32px]">
          <p data-name="标题" class="w-full text-text type-section">设置</p>
        </div>
        <sp-use component="导航项" data-name="工作区" class="w-full h-control" data-click="08 设置/工作区" props="图标: 隐藏">
          <p data-name="标签">工作区</p>
          <div data-name="图标">
            <p data-name="字标">工</p>
          </div>
        </sp-use>
        <sp-use component="导航项" data-name="安全与解锁" class="w-full h-control" data-click="08 设置/安全与解锁" props="图标: 隐藏">
          <p data-name="标签">安全与解锁</p>
          <div data-name="图标">
            <p data-name="字标">安</p>
          </div>
        </sp-use>
        <sp-use component="导航项" data-name="SSH 密钥" class="w-full h-control" data-click="08 设置/SSH 密钥" props="图标: 隐藏"><p data-name="标签">SSH 密钥</p></sp-use>
        <sp-use component="导航项" data-name="加速与代理" class="w-full h-control" data-click="08 设置/加速与代理" props="图标: 隐藏">
          <p data-name="标签">加速与代理</p>
        </sp-use>
        <sp-use component="导航项" props="状态: 选中; 图标: 隐藏" data-name="运行与后台" class="w-full h-control" data-click="08 设置/运行与后台">
          <p data-name="标签">运行与后台</p>
          <div data-name="图标">
            <p data-name="字标">运</p>
          </div>
        </sp-use>
        <sp-use component="导航项" data-name="授权中心" class="w-full h-control" data-click="08 设置/授权中心 · 待处理" props="图标: 隐藏">
          <p data-name="标签">授权中心</p>
          <div data-name="图标">
            <p data-name="字标">授</p>
          </div>
        </sp-use>
      </div>
      <div data-name="设置内容" class="flex flex-col gap-space-sm pr-space-md pb-space-md pl-space-md left-[216px] top-[8px] w-[856px] h-[744px] bg-surface rounded-window-panel">
        <div data-name="分类标题" class="flex flex-row items-center gap-space-sm w-full h-[32px]">
          <p data-name="标题" class="w-full text-text type-section">运行与后台</p>
          <sp-use component="图标按钮" data-name="关闭设置">
            <p data-name="图标"></p>
          </sp-use>
        </div>
        <div data-name="设置滚动内容" class="flex flex-col items-start w-full h-full">
          <div data-name="设置内容容器" class="flex flex-col gap-space-md w-full max-w-settings-content">
            <div data-name="偏好设置" class="flex flex-col p-space-lg w-full">
              <sp-use component="设置行" data-name="主窗口关闭行为" class="w-full" props="控件: 选择">
                <p data-name="标签">主窗口关闭行为</p>
                <div data-name="值控件">
                  <p data-name="当前值">关闭窗口后继续驻留</p>
                </div>
              </sp-use>
              <sp-use component="设置行" data-name="驻留时显示 Dock" class="w-full" props="控件: 开关; 状态: 开启">
                <p data-name="标签">驻留时显示 Dock</p>
                <div data-name="值控件">
                  <p data-name="当前值">显示</p>
                </div>
              </sp-use>
              <sp-use component="设置行" data-name="菜单栏图标" class="w-full" props="控件: 开关; 状态: 开启">
                <p data-name="标签">菜单栏图标</p>
                <div data-name="值控件">
                  <p data-name="当前值">显示</p>
                </div>
              </sp-use>
              <p data-name="Dock 前台规则" class="w-full text-muted type-panel-label">窗口打开或最小化时显示 Dock。</p>
              <p data-name="驻留说明" class="w-full text-muted type-panel-label">驻留隐藏相关窗口；退出会锁定连接。</p>
            </div>
          </div>
        </div>
      </div>
      <sp-use component="窗口控制" data-name="原生窗口按钮"></sp-use>
    </div>
  </body>
</html>
