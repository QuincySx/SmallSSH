<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>本机 CLI 配对确认</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[960px] h-[600px] bg-canvas">
  <div data-name="模态承载" class="flex flex-col gap-[8px] p-[40px] w-full h-full bg-canvas">
    <div data-name="对话框" class="flex flex-col gap-[16px] p-[16px] w-full h-full bg-surface rounded-panel">
      <div data-name="标题" class="flex flex-row items-center gap-[8px] w-full">
        <p data-name="标题文字" class="w-full text-text type-section">配对 / 修复本机 CLI</p>
        <sp-use component="图标按钮" data-name="关闭弹窗">
          <p data-name="图标"></p>
        </sp-use>
      </div>
      <div data-name="配对信息" class="flex flex-col gap-[8px] w-full">
        <p data-name="区别" class="w-full text-muted type-body">只确认本机代理身份，不授予服务器权限。</p>
        <p data-name="指纹" class="w-full text-accent type-body">sha256:EXAMPLE_LOCAL_BROKER_PUBLIC_FINGERPRINT</p>
        <p data-name="警告" class="w-full text-muted type-body">替换已有配对前请独立核对这是你当前的保险库。</p>
      </div>
      <div data-name="底部操作" class="flex flex-row items-center gap-[8px] w-full">
        <sp-use component="按钮" props="样式: 普通" data-name="取消">
          <p data-name="文字">取消</p>
        </sp-use>
        <sp-use component="按钮" data-name="确认配对">
          <p data-name="文字">确认配对</p>
        </sp-use>
      </div>
    </div>
  </div>
</body>
</html>
