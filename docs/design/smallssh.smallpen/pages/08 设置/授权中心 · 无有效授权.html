<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>授权中心 · 无有效授权</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-row p-space-sm gap-space-sm bg-canvas w-[1080px] h-[800px]">
    <div data-name="设置导航" class="flex flex-col w-settings-nav shrink-0 h-full px-space-md pb-space-md bg-surface rounded-window-panel">
      <div data-name="设置标题" class="flex flex-row items-center gap-space-sm w-full h-control">
        <p data-name="标题" class="type-section text-text">设置</p>
      </div>
      <div data-name="设置分类" class="flex flex-col w-full gap-0 pt-space-xs">
        <div data-name="工作区" class="flex flex-row items-center gap-space-sm w-full h-control rounded-control px-native-button-inline" data-click="08 设置/工作区">
          <p data-name="名称" class="type-native-copy text-text">工作区</p>
        </div>
        <div data-name="安全与解锁" class="flex flex-row items-center gap-space-sm w-full h-control rounded-control px-native-button-inline" data-click="08 设置/安全与解锁">
          <p data-name="名称" class="type-native-copy text-text">安全与解锁</p>
        </div>
        <div data-name="SSH 密钥" class="flex flex-row items-center gap-space-sm w-full h-control rounded-control px-native-button-inline" data-click="08 设置/SSH 密钥">
          <p data-name="名称" class="type-native-copy text-text">SSH 密钥</p>
        </div>
        <div data-name="加速与代理" class="flex flex-row items-center gap-space-sm w-full h-control rounded-control px-native-button-inline" data-click="08 设置/加速与代理">
          <p data-name="名称" class="type-native-copy text-text">加速与代理</p>
        </div>
        <div data-name="运行与后台" class="flex flex-row items-center gap-space-sm w-full h-control rounded-control px-native-button-inline" data-click="08 设置/运行与后台">
          <p data-name="名称" class="type-native-copy text-text">运行与后台</p>
        </div>
        <div data-name="授权中心" class="flex flex-row items-center gap-space-sm w-full h-control rounded-control px-native-button-inline bg-native-settings-selected" data-click="08 设置/授权中心 · 待处理">
          <p data-name="名称" class="type-native-copy text-accent">授权中心</p>
        </div>
      </div>
    </div>
    <div data-name="设置内容" class="flex flex-col flex-1 min-w-0 h-full px-space-md pb-space-md gap-space-sm bg-surface rounded-window-panel">
      <div data-name="设置栏目" class="flex flex-row items-center gap-space-sm w-full h-control">
        <p data-name="标题" class="flex-1 type-section text-text">授权中心</p>
        <div data-name="关闭窗口" class="flex flex-row items-center gap-space-sm w-control h-control shrink-0 justify-center">
          <p data-name="图标" class="w-menu-icon shrink-0 text-center type-native-action-icon text-text"></p>
        </div>
      </div>
      <div data-name="栏目内容" class="flex flex-col flex-1 min-h-0 gap-space-md">
        <div data-name="授权分类" class="flex flex-row items-center gap-toolbar w-full">
          <div data-name="待确认" class="flex flex-row items-center gap-space-sm w-fit h-task-tab px-field-inline rounded-control" data-click="08 设置/授权中心 · 待处理">
            <p data-name="名称" class="type-native-small text-muted">待确认</p>
          </div>
          <div data-name="当前授权" class="flex flex-row items-center gap-space-sm w-fit h-task-tab px-field-inline rounded-control bg-native-tab-selected" data-click="08 设置/授权中心 · 活动">
            <p data-name="名称" class="type-native-small text-accent">当前授权</p>
          </div>
          <div data-name="审计记录" class="flex flex-row items-center gap-space-sm w-fit h-task-tab px-field-inline rounded-control" data-click="08 设置/授权中心 · 历史">
            <p data-name="名称" class="type-native-small text-muted">审计记录</p>
          </div>
        </div>
        <div data-name="当前授权内容" class="flex flex-col w-full gap-space-md flex-1 min-h-0">
          <div data-name="页面标题" class="flex flex-row items-center gap-space-sm w-full h-control">
            <p data-name="标题" class="flex-1 type-native-dialog text-text">当前授权</p>
            <div data-name="刷新授权" class="flex flex-row items-center gap-space-sm w-fit h-control justify-center px-native-button-inline rounded-control bg-native-quiet">
              <p data-name="文字" class="type-native-copy text-text">刷新授权</p>
            </div>
          </div>
          <p data-name="服务器分组" class="type-native-label text-text">服务器操作授权 · 0</p>
          <p data-name="空服务器授权" class="type-native-small text-muted">暂无有效服务器授权</p>
          <p data-name="密钥分组" class="type-native-label text-text">SSH 密钥授权</p>
          <p data-name="空密钥授权" class="type-native-small text-muted">暂无有效密钥限时授权</p>
        </div>
      </div>
    </div>
</body>
</html>
