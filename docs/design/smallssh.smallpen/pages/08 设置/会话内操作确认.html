<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>会话内操作确认</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col gap-space-sm w-authorization-prompt h-approval-prompt-height px-approval-prompt-inline py-space-lg bg-canvas">
    <div data-name="申请方和类型" class="flex flex-col w-full gap-connection-nav-gap">
      <p data-name="申请方" class="w-full text-center type-native-dialog text-text">我的 AI 助手</p>
      <div data-name="授权类别" class="flex flex-row items-center gap-connection-nav-gap w-full justify-center">
        <p data-name="类型图标" class="w-menu-icon shrink-0 text-center type-native-icon text-accent"></p>
        <p data-name="类别" class="type-native-caption-emphasis text-accent">服务器操作授权</p>
      </div>
    </div>
    <div data-name="请求内容" class="flex flex-col w-full gap-space-sm p-approval-panel bg-surface rounded-native-navigation border border-border">
      <div data-name="折叠标题" class="flex flex-row items-center gap-toolbar w-full h-approval-card-heading">
        <p data-name="展开" class="w-approval-card-toggle shrink-0 text-center type-native-action-icon text-text"></p>
        <p data-name="权限" class="type-native-caption-emphasis text-warning">执行命令</p>
      </div>
      <p data-name="服务器目标" class="type-native-hint text-muted">个人服务器 · deploy@192.0.2.10:22</p>
    </div>
    <div data-name="本次操作" class="flex flex-col w-full gap-connection-nav-gap">
      <p data-name="警告" class="type-native-label text-warning">本次操作确认 · 命令需要核对</p>
      <p data-name="适用范围" class="type-native-hint text-muted">仅本次，不扩大或续期会话权限</p>
      <p data-name="命令标签" class="type-native-hint text-muted">完整命令</p>
      <div data-name="命令内容" class="flex flex-row items-center gap-space-sm w-full h-control px-field-inline bg-surface rounded-control">
        <p data-name="命令" class="type-log text-text">systemctl restart nginx</p>
      </div>
    </div>
    <div data-name="预留区" class="flex-1 w-full">
    </div>
    <sp-use data-name="验证与决定" component="授权验证底栏" props="切换验证: 有" class="w-full">
      <div data-name="操作"><div data-name="拒绝" data-click="back"></div></div>
    </sp-use>
</body>
</html>
