<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>保护路径编辑器</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[960px] h-[760px] bg-canvas">
  <div data-name="模态承载" class="flex flex-col items-center justify-center gap-[8px] w-full h-full">
    <div data-name="保护路径对话框" class="flex flex-col gap-[12px] p-[16px] w-[720px] bg-surface rounded-panel">
      <div data-name="标题" class="flex flex-row items-center gap-[8px] w-full">
        <p data-name="标题文字" class="w-full text-text type-section">保护路径</p>
        <sp-use component="图标按钮" data-name="关闭弹窗">
          <p data-name="图标"></p>
        </sp-use>
      </div>
      <p data-name="服务器" class="w-full text-muted type-detail">Web 生产环境</p>
      <div data-name="保护路径内容" class="flex flex-col gap-[8px] w-full">
        <p data-name="说明" class="w-full text-text type-body">AI 的文件操作不能读取、下载或修改这些路径。每行一个绝对路径；留空使用默认保护路径。</p>
        <p data-name="字段标签" class="w-full text-text type-body">保护路径输入</p>
        <div data-name="多行路径编辑器" class="flex flex-col gap-[8px] p-[8px] w-full h-[210px] bg-surface border border-accent rounded-control">
          <p data-name="路径值" class="w-full text-text type-path">/etc<br>/boot<br>/usr<br>/bin<br>/sbin<br>/lib<br>/lib64<br>/proc<br>/sys<br>/dev<br>/home<br>/root</p>
        </div>
      </div>
      <div data-name="底部操作" class="flex flex-row items-center gap-[8px] w-full">
        <div data-name="操作留白" class="flex flex-col gap-[8px] w-full"></div>
        <sp-use component="按钮" props="样式: 普通" data-name="取消" data-click="03 连接/访问策略">
          <p data-name="文字">取消</p>
        </sp-use>
        <sp-use component="按钮" data-name="应用">
          <p data-name="文字">应用</p>
        </sp-use>
      </div>
    </div>
  </div>
</body>
</html>
