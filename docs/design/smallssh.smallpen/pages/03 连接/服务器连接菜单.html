<!doctype html>
<html><head><meta charset="utf-8"><title>服务器连接菜单</title><link rel="stylesheet" href="../../tokens.css"></head>
<body class="flex flex-col w-[256px] h-fit bg-surface"><div data-name="菜单" class="flex flex-col py-space-xs w-full h-fit bg-surface border border-border rounded-control">
    <div data-name="菜单项1" data-click="02 工作台/终端与底部文件" class="flex flex-row items-center gap-space-sm px-space-md w-full h-menu-item"><p data-name="文字" class="w-full text-text type-menu">新建终端标签</p></div>
    <div data-name="菜单项3" data-click="overlay:03 连接/本次线路菜单; position: top-right; close-outside" class="flex flex-row items-center gap-space-sm px-space-md w-full h-menu-item"><p data-name="文字" class="w-full text-text type-menu">终端连接</p><p data-name="子菜单" class="text-muted type-menu">›</p></div>
    <div data-name="菜单项4" data-click="09 工具/SSH 隧道" class="flex flex-row items-center gap-space-sm px-space-md w-full h-menu-item"><p data-name="文字" class="w-full text-text type-menu">新建端口转发…</p></div>
    <div data-name="菜单项5" data-click="09 工具/VNC 远程桌面连接" class="flex flex-row items-center gap-space-sm px-space-md w-full h-menu-item"><p data-name="文字" class="w-full text-text type-menu">VNC 远程桌面…</p></div>
    <div data-name="菜单项6" data-click="03 连接/常规与密码" class="flex flex-row items-center gap-space-sm px-space-md w-full h-menu-item"><p data-name="文字" class="w-full text-text type-menu">编辑连接</p></div>
    <div data-name="菜单项7" data-click="03 连接/访问策略" class="flex flex-row items-center gap-space-sm px-space-md w-full h-menu-item"><p data-name="文字" class="w-full text-text type-menu">AI 访问…</p></div>
    <div data-name="菜单项8" data-click="09 工具/服务器备注" class="flex flex-row items-center gap-space-sm px-space-md w-full h-menu-item"><p data-name="文字" class="w-full text-text type-menu">备注…</p></div>
    <div data-name="菜单项9" data-click="close-overlay" class="flex flex-row items-center gap-space-sm px-space-md w-full h-menu-item"><p data-name="文字" class="w-full text-text type-menu">删除连接</p></div>
</div></body></html>
