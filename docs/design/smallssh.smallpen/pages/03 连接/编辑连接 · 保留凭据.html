<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>编辑连接 · 保留凭据</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="relative flex items-center justify-center bg-canvas w-[1280px] h-[900px]">
    <div data-name="背景承载" class="absolute inset-0 flex flex-row">
      <sp-use component="连接弹窗背景" data-name="工作台背景" class="w-full h-full">
        <div data-name="服务器侧栏">
          <div data-name="服务器">
            <p data-name="名称">示例服务器</p>
          </div>
        </div>
      </sp-use>
    </div>
    <div data-name="模态遮罩" class="absolute inset-0 bg-dialog-shade">
    </div>
    <div data-name="连接对话框" class="flex flex-col w-dialog-large h-connection-editor-height gap-space-sm p-space-md bg-surface rounded-window-panel shadow-native-dialog">
      <div data-name="窗口标题" class="flex flex-row items-center gap-space-sm w-full h-control">
        <p data-name="标题" class="flex-1 type-section text-text">编辑连接</p>
        <div data-name="关闭连接" class="flex flex-row items-center gap-space-sm w-control h-control shrink-0 justify-center" data-click="02 工作台/终端与底部文件">
          <p data-name="图标" class="w-menu-icon shrink-0 text-center type-native-action-icon text-text"></p>
        </div>
      </div>
      <div data-name="分类与表单" class="flex flex-row flex-1 min-h-0 w-full gap-space-lg">
        <div data-name="连接分类" class="flex flex-col gap-space-xs w-dialog-sidebar shrink-0 h-full p-connection-classification-inset bg-canvas border border-border rounded-control">
          <sp-use component="连接分类项" data-name="常规" class="w-full" props="状态: 选中" data-click="03 连接/常规与密码">
            <div data-name="图标容器"><p data-name="图标"></p></div>
            <p data-name="标签">常规</p>
          </sp-use>
          <sp-use component="连接分类项" data-name="加速与代理" class="w-full" data-click="03 连接/加速与代理">
            <div data-name="图标容器"><p data-name="图标"></p></div>
            <p data-name="标签">加速与代理</p>
          </sp-use>
          <sp-use component="连接分类项" data-name="终端设置" class="w-full" data-click="03 连接/编码与保活">
            <div data-name="图标容器"><p data-name="图标"></p></div>
            <p data-name="标签">终端设置</p>
          </sp-use>
          <sp-use component="连接分类项" data-name="访问策略" class="w-full" data-click="03 连接/访问策略">
            <div data-name="图标容器"><p data-name="图标"></p></div>
            <p data-name="标签">访问策略</p>
          </sp-use>
        </div>
        <div data-name="分类内容滚动视口" class="flex flex-col flex-1 min-w-0 h-full overflow-hidden pr-connection-form-end">
          <div data-name="常规表单" class="flex flex-col w-full gap-space-lg">
            <div data-name="连接信息" class="flex flex-col w-full gap-space-sm">
              <p data-name="标题" class="type-native-label text-text">连接信息</p>
              <div data-name="连接字段" class="flex flex-col w-full gap-space-sm">
                <div data-name="名称" class="flex flex-row w-full gap-space-sm items-center">
                  <p data-name="标签" class="w-connection-form-label shrink-0 text-right type-native-copy text-text">名称</p>
                  <div data-name="输入" class="flex flex-row items-center gap-space-sm flex-1 h-field px-field-inline bg-surface border border-accent rounded-control">
                    <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">示例服务器</p>
                  </div>
                </div>
                <div data-name="服务器地址" class="flex flex-row w-full gap-space-sm items-center">
                  <p data-name="标签" class="w-connection-form-label shrink-0 text-right type-native-copy text-text">服务器地址</p>
                  <div data-name="输入" class="flex flex-row items-center gap-space-sm flex-1 h-field px-field-inline bg-surface border border-border rounded-control">
                    <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">192.0.2.10</p>
                  </div>
                  <p data-name="端口标签" class="text-muted type-native-copy shrink-0">端口</p>
                  <div data-name="端口" class="flex flex-row items-center gap-space-sm w-connection-port shrink-0 h-field px-field-inline bg-surface border border-border rounded-control">
                    <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">22</p>
                  </div>
                </div>
                <div data-name="分组" class="flex flex-row w-full gap-space-sm items-center">
                  <p data-name="标签" class="w-connection-form-label shrink-0 text-right type-native-copy text-text">分组</p>
                  <div data-name="输入" class="flex flex-row items-center gap-space-sm flex-1 h-field pl-field-inline bg-surface border border-border rounded-control">
                    <p data-name="值" class="type-native-copy text-muted flex-1 min-w-0">选择已有分组，或输入新分组</p>
                    <sp-use component="图标按钮" data-name="展开分组" class="w-native-field-action h-native-field-action shrink-0">
                      <p data-name="图标"></p>
                    </sp-use>
                  </div>
                </div>
              </div>
            </div>
            <div data-name="登录身份" class="flex flex-col w-full gap-space-sm">
              <p data-name="标题" class="type-native-label text-text">登录身份</p>
              <div data-name="身份字段" class="flex flex-col w-full gap-space-sm">
                <div data-name="用户名" class="flex flex-row w-full gap-space-sm items-center">
                  <p data-name="标签" class="w-connection-form-label shrink-0 text-right type-native-copy text-text">用户名</p>
                  <div data-name="输入" class="flex flex-row items-center gap-space-sm flex-1 h-field px-field-inline bg-surface border border-border rounded-control">
                    <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">root</p>
                  </div>
                </div>
                <div data-name="登录方式" class="flex flex-row w-full gap-space-sm items-center">
                  <p data-name="标签" class="w-connection-form-label shrink-0 text-right type-native-copy text-text">登录方式</p>
                  <div data-name="输入" class="flex flex-row items-center gap-space-sm flex-1 h-field px-field-inline bg-surface border border-border rounded-control" data-click="overlay:03 连接/登录方式菜单; position: center">
                    <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">服务器密码</p>
                    <p data-name="图标" class="w-menu-icon shrink-0 text-center type-native-icon text-muted"></p>
                  </div>
                </div>
                <div data-name="已保存凭据" class="flex flex-col w-full gap-space-sm">
                  <div data-name="已保存的登录信息" class="flex flex-row w-full gap-space-sm items-center">
                    <p data-name="标签" class="w-fit shrink-0 text-right type-native-copy text-text">已保存的登录信息</p>
                    <sp-use component="复选框" data-name="更换登录凭据" props="状态: 未选">
                      <p data-name="标签" class="type-native-copy">更换登录凭据</p>
                    </sp-use>
                  </div>
                  <div data-name="服务器身份" class="flex flex-row w-full gap-space-sm items-start">
                    <div data-name="标签容器" class="flex flex-col w-connection-form-label shrink-0 pt-space-sm">
                      <p data-name="标签" class="w-full text-right type-native-copy text-text">服务器身份</p>
                    </div>
                    <div data-name="信任状态" class="flex flex-col w-full gap-native-field flex-1 min-w-0">
                      <p data-name="已保存指纹" class="type-native-hint text-text">已信任 · SHA256:EXAMPLE_PUBLIC_FINGERPRINT</p>
                      <div data-name="重新核对服务器身份" class="flex flex-row items-center gap-space-sm  h-control justify-center px-native-button-inline rounded-control bg-native-quiet w-full">
                        <p data-name="文字" class="type-native-copy text-text">重新核对服务器身份</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div data-name="备注" class="flex flex-row w-full gap-space-sm items-start">
              <div data-name="标签容器" class="flex flex-col w-connection-form-label shrink-0 pt-space-sm">
                <p data-name="标签" class="w-full text-right type-native-copy text-text">备注</p>
              </div>
              <div data-name="备注输入与状态" class="flex flex-col w-full gap-native-field flex-1 min-w-0">
                <div data-name="文本框" class="flex flex-col w-full h-connection-note-preview px-field-inline py-space-sm bg-surface border border-border rounded-control">
                  <p data-name="内容" class="w-full whitespace-pre-wrap type-native-copy text-muted">用途、维护事项，或提醒以后的自己…</p>
                </div>
                <p data-name="读取错误" class="type-native-hint text-text">读取服务器备注失败：保险库已锁定，请重新解锁后继续</p>
                <div data-name="重试读取" class="flex flex-row items-center gap-space-sm  h-control justify-center px-native-button-inline rounded-control bg-native-quiet w-full">
                  <p data-name="文字" class="type-native-copy text-text">重试读取</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div data-name="底部操作" class="flex flex-row items-center gap-space-sm w-full h-field justify-end">
        <div data-name="取消" class="flex flex-row items-center gap-space-sm w-fit h-field justify-center px-native-button-inline rounded-control bg-native-quiet" data-click="02 工作台/终端与底部文件">
          <p data-name="文字" class="type-native-copy text-text">取消</p>
        </div>
        <div data-name="保存连接" class="flex flex-row items-center gap-space-sm w-fit h-field justify-center px-native-button-inline rounded-control bg-accent opacity-disabled">
          <p data-name="文字" class="type-native-copy text-onaccent">保存连接</p>
        </div>
      </div>
    </div>
</body>
</html>
