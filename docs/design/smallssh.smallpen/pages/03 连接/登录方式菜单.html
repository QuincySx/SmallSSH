<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>登录方式菜单</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[260px] h-fit p-space-xs bg-surface border border-border rounded-control">
    <div data-name="服务器密码" class="flex flex-row items-center gap-space-sm w-full h-control px-field-inline rounded-control" data-click="03 连接/常规与密码">
      <p data-name="名称" class="type-native-copy text-text">服务器密码</p>
    </div>
    <div data-name="已有私钥" class="flex flex-row items-center gap-space-sm w-full h-control px-field-inline rounded-control" data-click="03 连接/已有私钥">
      <p data-name="名称" class="type-native-copy text-text">已有私钥</p>
    </div>
    <div data-name="SmallSSH 密钥" class="flex flex-row items-center gap-space-sm w-full h-control px-field-inline rounded-control" data-click="03 连接/SmallSSH 密钥">
      <p data-name="名称" class="type-native-copy text-text">SmallSSH 密钥</p>
    </div>
    <div data-name="SSH 密钥代理" class="flex flex-row items-center gap-space-sm w-full h-control px-field-inline rounded-control" data-click="03 连接/SSH 密钥代理">
      <p data-name="名称" class="type-native-copy text-text">SSH 密钥代理</p>
    </div>
    <div data-name="硬件密钥" class="flex flex-row items-center gap-space-sm w-full h-control px-field-inline rounded-control" data-click="03 连接/硬件认证">
      <p data-name="名称" class="type-native-copy text-text">硬件密钥</p>
    </div>
</body>
</html>
