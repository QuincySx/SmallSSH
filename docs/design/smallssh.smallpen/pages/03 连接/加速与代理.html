<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>加速与代理</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[1000px] h-[820px] bg-canvas">
  <div data-name="模态承载" class="flex flex-col gap-[8px] p-[40px] w-full h-full bg-canvas">
    <div data-name="对话框" class="flex flex-col gap-[16px] p-[16px] w-full h-full bg-surface rounded-panel">
      <div data-name="标题" class="flex flex-row items-center gap-[8px] w-full">
        <p data-name="标题文字" class="w-full text-text type-section">新建连接</p>
        <sp-use component="图标按钮" data-name="关闭弹窗">
          <p data-name="图标"></p>
        </sp-use>
      </div>
      <div data-name="分类与表单" class="flex flex-row items-center gap-[16px] w-full h-full">
        <div data-name="连接分类" class="flex flex-col gap-[8px] w-[144px] h-full">
          <sp-use component="导航项" data-name="常规" class="w-full">
            <p data-name="标签">常规</p>
            <div data-name="图标">
              <p data-name="字标">常</p>
            </div>
          </sp-use>
          <sp-use component="导航项" props="状态: 选中" data-name="加速与代理" class="w-full">
            <p data-name="标签">加速与代理</p>
            <div data-name="图标">
              <p data-name="字标">加</p>
            </div>
          </sp-use>
          <sp-use component="导航项" data-name="终端设置" class="w-full">
            <p data-name="标签">终端设置</p>
            <div data-name="图标">
              <p data-name="字标">终</p>
            </div>
          </sp-use>
          <sp-use component="导航项" data-name="访问策略" class="w-full">
            <p data-name="标签">访问策略</p>
            <div data-name="图标">
              <p data-name="字标">访</p>
            </div>
          </sp-use>
        </div>
        <div data-name="表单内容" class="flex flex-col gap-[16px] w-full h-full">
          <div data-name="连接路线" class="flex flex-col gap-[12px] w-full">
            <p data-name="标题" class="w-full text-text type-section">连接路线</p>
            <div data-name="字段组" class="flex flex-col gap-[12px] w-full">
              <div data-name="字段 代理方式" class="flex flex-row items-center gap-[8px] w-full">
                <p data-name="标签" class="w-[116px] text-text type-body">代理方式</p>
                <sp-use component="输入框" data-name="值" class="w-full">
                  <p data-name="值">SOCKS5</p>
                </sp-use>
              </div>
              <div data-name="字段 代理地址" class="flex flex-row items-center gap-[8px] w-full">
                <p data-name="标签" class="w-[116px] text-text type-body">代理地址</p>
                <sp-use component="输入框" data-name="值" class="w-full">
                  <p data-name="值">127.0.0.1:1080</p>
                </sp-use>
              </div>
              <div data-name="字段 代理用户名" class="flex flex-row items-center gap-[8px] w-full">
                <p data-name="标签" class="w-[116px] text-text type-body">代理用户名</p>
                <sp-use component="输入框" data-name="值" class="w-full">
                  <p data-name="值">example</p>
                </sp-use>
              </div>
              <div data-name="字段 代理密码" class="flex flex-row items-center gap-[8px] w-full">
                <p data-name="标签" class="w-[116px] text-text type-body">代理密码</p>
                <sp-use component="输入框" data-name="值" class="w-full">
                  <p data-name="值">••••••</p>
                </sp-use>
              </div>
              <div data-name="字段 SSH 中转" class="flex flex-row items-center gap-[8px] w-full">
                <p data-name="标签" class="w-[116px] text-text type-body">SSH 中转</p>
                <sp-use component="输入框" data-name="值" class="w-full">
                  <p data-name="值">不使用中转</p>
                </sp-use>
              </div>
            </div>
          </div>
          <sp-use component="按钮" props="样式: 普通" data-name="比较握手耗时">
            <p data-name="文字">比较握手耗时</p>
          </sp-use>
          <p data-name="限制" class="w-full text-muted type-detail">当前支持代理与自有中转；UDP 双端加速尚未实现。</p>
        </div>
      </div>
      <div data-name="底部操作" class="flex flex-row items-center gap-[8px] w-full">
        <sp-use component="按钮" props="样式: 普通" data-name="取消">
          <p data-name="文字">取消</p>
        </sp-use>
        <sp-use component="按钮" data-name="保存并连接">
          <p data-name="文字">保存并连接</p>
        </sp-use>
      </div>
    </div>
  </div>
</body>
</html>
