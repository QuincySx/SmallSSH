<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>编码与保活 · 已开启</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="relative flex items-center justify-center bg-canvas w-[1100px] h-[760px]">
    <div data-name="背景承载" class="absolute inset-0 flex flex-row">
      <sp-use component="连接弹窗背景" data-name="工作台背景" class="w-full h-full">
        <div data-name="服务器侧栏">
          <div data-name="服务器">
            <p data-name="名称">自有 SSH 中转</p>
          </div>
        </div>
      </sp-use>
    </div>
    <div data-name="模态遮罩" class="absolute inset-0 bg-dialog-shade">
    </div>
    <div data-name="连接对话框" class="flex flex-col w-dialog-large h-connection-editor-height gap-space-sm p-space-md bg-surface rounded-window-panel shadow-native-dialog">
      <div data-name="窗口标题" class="flex flex-row items-center gap-space-sm w-full h-control">
        <p data-name="标题" class="flex-1 type-section text-text">新建连接</p>
        <div data-name="关闭连接" class="flex flex-row items-center gap-space-sm w-control h-control shrink-0 justify-center" data-click="02 工作台/终端与底部文件">
          <p data-name="图标" class="w-menu-icon shrink-0 text-center type-native-action-icon text-text"></p>
        </div>
      </div>
      <div data-name="分类与表单" class="flex flex-row flex-1 min-h-0 w-full gap-space-lg">
        <div data-name="连接分类" class="flex flex-col gap-space-xs w-dialog-sidebar shrink-0 h-full p-connection-classification-inset bg-canvas border border-border rounded-control">
          <sp-use component="连接分类项" data-name="常规" class="w-full" data-click="03 连接/常规与密码">
            <div data-name="图标容器"><p data-name="图标"></p></div>
            <p data-name="标签">常规</p>
          </sp-use>
          <sp-use component="连接分类项" data-name="加速与代理" class="w-full" data-click="03 连接/加速与代理">
            <div data-name="图标容器"><p data-name="图标"></p></div>
            <p data-name="标签">加速与代理</p>
          </sp-use>
          <sp-use component="连接分类项" data-name="终端设置" class="w-full" props="状态: 选中" data-click="03 连接/编码与保活">
            <div data-name="图标容器"><p data-name="图标"></p></div>
            <p data-name="标签">终端设置</p>
          </sp-use>
          <sp-use component="连接分类项" data-name="访问策略" class="w-full" data-click="03 连接/访问策略">
            <div data-name="图标容器"><p data-name="图标"></p></div>
            <p data-name="标签">访问策略</p>
          </sp-use>
        </div>
        <div data-name="分类内容滚动视口" class="flex flex-col flex-1 min-w-0 h-full overflow-hidden pr-connection-form-end">
          <div data-name="终端表单" class="flex flex-col w-full gap-space-sm">
            <div data-name="字符编码" class="flex flex-col w-full gap-native-field">
              <p data-name="标签" class="type-native-copy text-text">字符编码</p>
              <div data-name="输入" class="flex flex-row items-center gap-space-sm w-full h-field px-field-inline bg-surface border border-border rounded-control">
                <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">自动（UTF-8 优先）</p>
                <p data-name="图标" class="w-menu-icon shrink-0 text-center font-icons text-icon-compact leading-[1] text-muted"></p>
              </div>
            </div>
            <div data-name="退格序列" class="flex flex-col w-full gap-native-field">
              <p data-name="标签" class="type-native-copy text-text">退格序列</p>
              <div data-name="输入" class="flex flex-row items-center gap-space-sm w-full h-field px-field-inline bg-surface border border-border rounded-control">
                <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">自动（协商 ^?）</p>
                <p data-name="图标" class="w-menu-icon shrink-0 text-center font-icons text-icon-compact leading-[1] text-muted"></p>
              </div>
            </div>
            <div data-name="SSH 保活间隔" class="flex flex-col w-full gap-native-field">
              <p data-name="标签" class="type-native-copy text-text">SSH 保活间隔</p>
              <div data-name="输入" class="flex flex-row items-center gap-space-sm w-full h-field px-field-inline bg-surface border border-border rounded-control" data-click="03 连接/编码与保活">
                <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">30 秒</p>
                <p data-name="图标" class="w-menu-icon shrink-0 text-center font-icons text-icon-compact leading-[1] text-muted"></p>
              </div>
            </div>
            <p data-name="开关说明" class="type-native-hint text-muted">开：定时探测连接；关：不发送探测。</p>
            <div data-name="无响应等待上限" class="flex flex-col w-full gap-native-field">
              <p data-name="标签" class="type-native-copy text-text">无响应等待上限</p>
              <div data-name="输入" class="flex flex-row items-center gap-space-sm w-full h-field px-field-inline bg-surface border border-border rounded-control">
                <p data-name="值" class="type-native-copy text-text flex-1 min-w-0">3 个保活间隔（默认）</p>
                <p data-name="图标" class="w-menu-icon shrink-0 text-center font-icons text-icon-compact leading-[1] text-muted"></p>
              </div>
            </div>
            <p data-name="等待说明" class="type-native-hint text-muted">最长等待 90 秒，超时断开。</p>
          </div>
        </div>
      </div>
      <div data-name="底部操作" class="flex flex-row items-center gap-space-sm w-full h-field justify-end">
        <div data-name="取消" class="flex flex-row items-center gap-space-sm w-fit h-field justify-center px-native-button-inline rounded-control bg-native-quiet" data-click="02 工作台/终端与底部文件">
          <p data-name="文字" class="type-native-copy text-text">取消</p>
        </div>
        <div data-name="保存连接" class="flex flex-row items-center gap-space-sm w-fit h-field justify-center px-native-button-inline rounded-control bg-accent">
          <p data-name="文字" class="type-native-copy text-onaccent">保存连接</p>
        </div>
      </div>
    </div>
</body>
</html>
