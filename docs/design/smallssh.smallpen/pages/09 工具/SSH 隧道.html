<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SSH 隧道</title>
  <link rel="stylesheet" href="../../tokens.css">
</head>
<body class="flex flex-col w-[960px] h-[680px] bg-canvas">
  <div data-name="模态承载" class="flex flex-col gap-[8px] p-[40px] w-full h-full bg-canvas">
    <div data-name="对话框" class="flex flex-col gap-[16px] p-[16px] w-full h-full bg-surface rounded-panel">
      <div data-name="标题" class="flex flex-row items-center gap-[8px] w-full">
        <p data-name="标题文字" class="w-full text-text type-section">SSH 隧道</p>
        <sp-use component="图标按钮" data-name="关闭弹窗">
          <p data-name="图标"></p>
        </sp-use>
      </div>
      <div data-name="隧道表单" class="flex flex-col gap-[8px] w-full">
        <div data-name="分类标签" class="flex flex-row items-center gap-[4px] w-full">
          <sp-use component="按钮" props="样式: 普通" data-name="本地">
            <p data-name="文字">本地</p>
          </sp-use>
          <sp-use component="按钮" props="样式: 轻量" data-name="远程">
            <p data-name="文字">远程</p>
          </sp-use>
          <sp-use component="按钮" props="样式: 轻量" data-name="SOCKS5">
            <p data-name="文字">SOCKS5</p>
          </sp-use>
        </div>
        <div data-name="字段组" class="flex flex-col gap-[12px] w-full">
          <div data-name="字段 监听地址" class="flex flex-row items-center gap-[8px] w-full">
            <p data-name="标签" class="w-[116px] text-text type-body">监听地址</p>
            <sp-use component="输入框" data-name="值" class="w-full">
              <p data-name="值">127.0.0.1:15432</p>
            </sp-use>
          </div>
          <div data-name="字段 目标地址" class="flex flex-row items-center gap-[8px] w-full">
            <p data-name="标签" class="w-[116px] text-text type-body">目标地址</p>
            <sp-use component="输入框" data-name="值" class="w-full">
              <p data-name="值">127.0.0.1:5432</p>
            </sp-use>
          </div>
        </div>
        <p data-name="活动隧道" class="w-full text-success type-body">本地 · 127.0.0.1:15432 → 127.0.0.1:5432</p>
        <sp-use component="按钮" props="样式: 普通" data-name="停止隧道">
          <p data-name="文字">停止隧道</p>
        </sp-use>
      </div>
      <div data-name="底部操作" class="flex flex-row items-center gap-[8px] w-full">
        <sp-use component="按钮" props="样式: 普通" data-name="关闭">
          <p data-name="文字">关闭</p>
        </sp-use>
        <sp-use component="按钮" data-name="启动隧道">
          <p data-name="文字">启动隧道</p>
        </sp-use>
      </div>
    </div>
  </div>
</body>
</html>
