<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>
VNC 远程桌面
    </title>
    <link rel="stylesheet" href="../../tokens.css">
  </head>
  <body class="flex flex-col w-[1280px] h-[860px] bg-canvas">
    <div data-name="工作台根" class="flex flex-row gap-space-sm p-space-sm w-full h-full">
      <div data-name="服务器侧栏外框" class="flex flex-col gap-space-sm w-[204px] h-full bg-surface rounded-panel">
        <div data-name="侧栏标题栏" class="flex flex-row items-center gap-space-xs w-full h-control">
          <sp-use component="窗口控制" props="位置: 侧栏" data-name="原生窗口按钮" class="w-sidebar-window-reserve h-control"></sp-use>
          <sp-use component="图标按钮" data-name="侧栏开关" class="w-control h-control">
            <p data-name="图标"></p>
          </sp-use>
          <sp-use component="图标按钮" data-name="新建连接" data-click="03 连接/常规与密码" class="w-control h-control">
            <p data-name="图标"></p>
          </sp-use>
          <div data-name="侧栏标题留白" class="w-full h-control"></div>
        </div>
        <div data-name="服务器侧栏" class="flex flex-col gap-space-sm w-full h-full p-connection-sidebar bg-surface rounded-panel">
          <sp-use component="输入框" data-name="搜索服务器" class="w-full h-connection-search">
            <p data-name="值">搜索服务器</p>
          </sp-use>
          <p data-name="分组" class="w-full text-muted type-detail">我的服务器</p>
          <sp-use component="导航项" props="状态: 选中" data-name="Web 生产环境" class="w-full h-[36px]">
            <p data-name="标签">Web 生产环境</p>
            <div data-name="图标">
              <p data-name="字标">W</p>
            </div>
          </sp-use>
          <sp-use component="导航项" data-name="Staging" class="w-full h-[36px]">
            <p data-name="标签">Staging</p>
            <div data-name="图标">
              <p data-name="字标">S</p>
            </div>
          </sp-use>
          <sp-use component="导航项" data-name="备份服务器" class="w-full h-[36px]">
            <p data-name="标签">备份服务器</p>
            <div data-name="图标">
              <p data-name="字标">备</p>
            </div>
          </sp-use>
        </div>
      </div>
      <div data-name="主内容列" class="flex flex-col gap-space-sm w-full h-full">
        <div data-name="标题栏" class="flex flex-row items-center gap-space-xs w-full h-control pl-space-sm">
          <sp-use component="工作区标签" data-name="Web 生产环境标签" class="h-[32px]">
            <p data-name="名称">Web 生产环境</p>
          </sp-use>
          <sp-use component="工作区标签" data-name="Staging标签" class="h-[32px]">
            <p data-name="名称">Staging</p>
          </sp-use>
          <sp-use component="工作区标签" props="状态: 选中" data-name="VNC 标签" class="h-[32px]">
            <p data-name="名称">示例服务器 · VNC</p>
          </sp-use>
          <div data-name="拖动空白" class="flex flex-col gap-space-sm w-full h-full"></div>
          <sp-use component="服务入口" data-name="端口转发" data-click="09 工具/服务列表" class="w-control h-control"></sp-use>
<sp-use component="图标按钮" data-name="任务入口" class="w-control h-control" data-click="09 工具/传输与任务中心">
            <p data-name="图标"></p>
          </sp-use>
          <sp-use component="图标按钮" data-name="工具面板开关" class="w-control h-control">
            <p data-name="图标"></p>
          </sp-use>
          <sp-use component="图标按钮" data-name="设置入口" class="w-control h-control">
            <p data-name="图标"></p>
          </sp-use>
        </div>
<div data-name="VNC 标签内容" class="flex flex-row gap-space-xs p-space-xs w-full h-full bg-canvas rounded-panel"><div data-name="桌面示意" class="flex flex-col items-center justify-center w-full h-full bg-subtle rounded-control"><p data-name="标题" class="w-[240px] text-center text-muted type-section">Linux 远程桌面</p></div><div data-name="VNC 右侧工具栏" class="flex flex-col items-center gap-space-xs p-space-xs w-vnc-rail h-full bg-surface rounded-control">
<div data-name="连接状态" class="flex flex-row items-center justify-center w-control h-[24px]"><div data-name="已连接" class="w-vnc-state h-vnc-state bg-success rounded-control"></div></div>
<div data-name="远程按键" data-click="overlay:09 工具/VNC 按键面板; position: top-right; close-outside" class="flex flex-row items-center justify-center w-control h-control rounded-control"><svg data-name="图标" viewBox="0 0 24 24" class="w-vnc-icon h-vnc-icon border-vnc-icon stroke-muted"><path d="M4.0 4.0H20.0Q22.0 4.0 22.0 6.0V18.0Q22.0 20.0 20.0 20.0H4.0Q2.0 20.0 2.0 18.0V6.0Q2.0 4.0 4.0 4.0Z M6 8h.6M10 8h.6M14 8h.6M18 8h.6M6 12h.6M10 12h.6M14 12h.6M18 12h.6M7 16h10"/></svg></div>
<div data-name="粘贴到远端" data-click="overlay:09 工具/VNC 剪贴板; position: bottom-center; close-outside" class="flex flex-row items-center justify-center w-control h-control rounded-control"><svg data-name="图标" viewBox="0 0 24 24" class="w-vnc-icon h-vnc-icon border-vnc-icon stroke-muted"><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M16 4h2a2 2 0 0 1 2 2v2 M9.0 2.0H15.0Q16.0 2.0 16.0 3.0V5.0Q16.0 6.0 15.0 6.0H9.0Q8.0 6.0 8.0 5.0V3.0Q8.0 2.0 9.0 2.0Z M11 13h10m-4-4 4 4-4 4"/></svg></div>
<div data-name="复制远端剪贴板" data-click="overlay:09 工具/VNC 剪贴板; position: bottom-center; close-outside" class="flex flex-row items-center justify-center w-control h-control rounded-control"><svg data-name="图标" viewBox="0 0 24 24" class="w-vnc-icon h-vnc-icon border-vnc-icon stroke-muted"><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8 M9.0 2.0H15.0Q16.0 2.0 16.0 3.0V5.0Q16.0 6.0 15.0 6.0H9.0Q8.0 6.0 8.0 5.0V3.0Q8.0 2.0 9.0 2.0Z M14.0 10.0H20.0Q22.0 10.0 22.0 12.0V20.0Q22.0 22.0 20.0 22.0H14.0Q12.0 22.0 12.0 20.0V12.0Q12.0 10.0 14.0 10.0Z"/></svg></div>
<div data-name="适应窗口" class="flex flex-row items-center justify-center w-control h-control rounded-control bg-accentsoft"><svg data-name="图标" viewBox="0 0 24 24" class="w-vnc-icon h-vnc-icon border-vnc-icon stroke-accent"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5 M8.0 7.0H16.0Q17.0 7.0 17.0 8.0V16.0Q17.0 17.0 16.0 17.0H8.0Q7.0 17.0 7.0 16.0V8.0Q7.0 7.0 8.0 7.0Z"/></svg></div>
<div data-name="切换全屏" data-click="09 工具/VNC 全屏" class="flex flex-row items-center justify-center w-control h-control rounded-control"><svg data-name="图标" viewBox="0 0 24 24" class="w-vnc-icon h-vnc-icon border-vnc-icon stroke-muted"><path d="M0 0 M15 3h6v6 M0 0 m21 3-7 7 M0 0 m3 21 7-7 M0 0 M9 21H3v-6"/></svg></div>
<div data-name="只读查看" class="flex flex-row items-center justify-center w-control h-control rounded-control"><svg data-name="图标" viewBox="0 0 24 24" class="w-vnc-icon h-vnc-icon border-vnc-icon stroke-muted"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/></svg></div>
<div data-name="重新连接" class="flex flex-row items-center justify-center w-control h-control rounded-control"><svg data-name="图标" viewBox="0 0 24 24" class="w-vnc-icon h-vnc-icon border-vnc-icon stroke-muted"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8 M21 3v5h-5 M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16 M8 16H3v5"/></svg></div>
<div data-name="断开连接" class="flex flex-row items-center justify-center w-control h-control rounded-control"><svg data-name="图标" viewBox="0 0 24 24" class="w-vnc-icon h-vnc-icon border-vnc-icon stroke-muted"><path d="M18 6 6 18 M6 6l12 12"/></svg></div>

</div></div></div></div></body></html>
